CONFIG_ZMK_DISPLAY=y
# Leave un-inverted: this gives a black background with white text on the SSD1306.
# CONFIG_ZMK_DISPLAY_INVERT=y is what produced the white background / black text.
CONFIG_ZMK_DISPLAY_INVERT=n

# Stroke weight. LVGL renders glyphs at 4bpp then thresholds to 1 bit on this
# luminance; the default 127 is a straight 50% cut, which puts 2px stems on
# Montserrat 16 and reads bold on a small OLED. Text is drawn dark-on-light in
# LVGL space (see INVERT above) and inverted by Zephyr's mono flush path, so ink
# is luminance <= threshold -- LOWER is thinner. 96 lightens everything visibly
# with no strokes breaking up; 64 is thinner again; below ~48 the tick and "%"
# start to fragment.
CONFIG_LV_DRAW_SW_I1_LUM_THRESHOLD=96
# Both replaced by shield-local widgets (see custom_status_screen.c):
#   layer  -> widgets/layer_status.c, which ignores the WINMODE/FN_WIN layers so
#             a toggled Windows mode doesn't mask COLEMAK / QWERTY / FN.
#   wpm    -> widgets/os_mode.c, showing MAC or WIN in the same corner.
# Turning WPM off also drops the ZMK_WPM subsystem it used to select.
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
CONFIG_ZMK_WIDGET_WPM_STATUS=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
# =y shows "100%" instead of the battery glyph (they are the #if/#else branches
# of the same block in battery_status.c -- you get one or the other, not both).
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
# ZMK's own output widget is replaced by widgets/output_status.c, which renders
# the transport as text ("USB" / "BLE <profile>") instead of glyphs that don't
# survive 1-bit at 16px. Turning ZMK's off keeps it out of the build.
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n

# Power Management Configuration
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
# Screen blanks after 30 seconds
CONFIG_ZMK_IDLE_TIMEOUT=30000
# Enable deep sleep
CONFIG_ZMK_SLEEP=y
# Enter deep sleep after 15 minutes
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Use custom_status_screen.c from this shield directory instead of ZMK's.
# NOTE: ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN is what implied LV_USE_THEME_MONO,
# LV_FONT_MONTSERRAT_12 and the default font -- switching to CUSTOM drops all
# three, so Kconfig.defconfig sets them explicitly. Without the mono theme,
# lv_theme_get_font_small() returns NULL and the layer widget would fault.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# CONFIG_ZMK_DISPLAY_WORK_QUEUE_SYSTEM=y
# CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=n

# CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=2048
# CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=5

# General USB settings
CONFIG_ZMK_USB=y
